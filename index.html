<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Сервис прекратил обслуживание</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .code {
      font-size: 72px;
      font-weight: 800;
      color: #f85149;
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #8b949e;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-family: monospace;
      color: #8b949e;
      background: #21262d;
      border-radius: 20px;
      border: 1px solid #30363d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Сервис прекратил обслуживание</h1>
    <p>Доступ к данному ресурсу был полностью ограничен. Проект завершил свою работу и больше недоступен.</p>
    <div class="badge">STATUS: TERMINATED</div>
  </div>
</body>
</html>
